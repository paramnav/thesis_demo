      Plotly.restyle(gd, { z: [z] }, [TI.heat]);
      Plotly.restyle(gd, { x: [tr.x3d], y: [tr.y3d], z: [tr.z] }, [TI.s3d]);
      Plotly.restyle(gd, { x: [tr.x2d], y: [tr.y2d], "marker.color": [tr.z] }, [TI.s2d]);
    }
  }

  async function loadData() {
    const status = el("status");
    try {
      const resp = await fetch(M.data_url);
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      const ds = new DecompressionStream("gzip");
      DATA = JSON.parse(await new Response(resp.body.pipeThrough(ds)).text());
      status.textContent = `${DATA.scenarios.length} scenarios loaded.`;
      applyUpdate();
    } catch (err) {
      status.textContent = "Could not load data cache — use GitHub Pages or a local web server.";
      console.error(err);
    }
  }

  function addGroup(title, inner) {
    const g = document.createElement("div");
    g.className = "group";
    g.innerHTML = `<div class="group-title">${title}</div>` + inner;
    document.getElementById(P + "-row").appendChild(g);
  }

  function wire() {
    addGroup("Outlier scenario", `<label>scenario <select id="${P}-scenario"></select></label>`);
    if (M.mode === "rf" || M.mode === "combined") {
      addGroup("Random Forest",
        `<label>max_depth <select id="${P}-rf-depth"></select></label>` +
        `<label>n_estimators <select id="${P}-rf-trees"></select></label>`);
    }
    if (M.mode === "mlp" || M.mode === "combined") {
      addGroup("MLP (PyTorch)",
        `<label>layers <select id="${P}-mlp-layers"></select></label>` +
        `<label>architecture <select id="${P}-mlp-arch"></select></label>` +
        `<label>batch norm <select id="${P}-mlp-bn"><option value="0">off</option><option value="1">on</option></select></label>` +
        `<label>dropout <select id="${P}-mlp-do"><option value="0">off</option><option value="1">on</option></select></label>` +
        `<label>loss <select id="${P}-mlp-loss"></select></label>` +
        `<label>batch size <select id="${P}-mlp-bs"></select></label>`);
    }
    if (M.mode === "knn" || M.mode === "combined") {
      addGroup("k-NN", `<label>k <select id="${P}-knn-k"></select></label>`);
    }

    fill(el("scenario"), M.scenario_names.map((_, i) => i), M.scenario_names);
    if (M.mode === "rf" || M.mode === "combined") {
      fill(el("rf-depth"), M.depth_values);
      fill(el("rf-trees"), M.tree_values);
      el("rf-depth").value = String(M.defaults.depth);
      el("rf-trees").value = String(M.defaults.trees);
    }
    if (M.mode === "mlp" || M.mode === "combined") {
      fill(el("mlp-layers"), Object.keys(M.arch_by_layers));
      fill(el("mlp-loss"), M.defaults.loss_choices);
      fill(el("mlp-bs"), M.defaults.batch_choices);
      el("mlp-layers").value = String(M.defaults.layers);
      el("mlp-bn").value = String(M.defaults.bn);
      el("mlp-do").value = String(M.defaults.dropout);
      el("mlp-loss").value = M.defaults.loss;
      el("mlp-bs").value = String(M.defaults.batch_size);
      refreshArchOptions();
      el("mlp-arch").value = M.defaults.arch_label;
    }
    if (M.mode === "knn" || M.mode === "combined") {
      fill(el("knn-k"), M.k_values);
      el("knn-k").value = String(M.defaults.k);
    }

    const ids = ["scenario"];
    if (M.mode === "rf" || M.mode === "combined") ids.push("rf-depth", "rf-trees");
    if (M.mode === "mlp" || M.mode === "combined") ids.push("mlp-layers", "mlp-arch", "mlp-bn", "mlp-do", "mlp-loss", "mlp-bs");
    if (M.mode === "knn" || M.mode === "combined") ids.push("knn-k");
    ids.forEach(id => el(id).addEventListener("change", () => {
      if (id === "mlp-layers") refreshArchOptions();
      applyUpdate();
    }));
    loadData();
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", wire);
  else wire();
})();
</script>
