(function() {
  const M = window["META_exp3_1d"];
  const P = M.prefix;
  const plotId = P + "-plot";
  let showHidden = false;

  function el(id) { return document.getElementById(P + "-" + id); }

  function fill(sel, values, labels) {
    sel.innerHTML = "";
    values.forEach((v, i) => {
      const o = document.createElement("option");
      o.value = String(v);
      o.textContent = labels ? labels[i] : String(v);
      sel.appendChild(o);
    });
  }

  function mlpKey() {
    return `L${el("mlp-layers").value}|${el("mlp-arch").value}|bn${el("mlp-bn").value}|do${el("mlp-do").value}|${el("mlp-loss").value}|bs${el("mlp-bs").value}`;
  }

  function refreshArchOptions() {
    const L = el("mlp-layers").value;
    const sel = el("mlp-arch");
    const opts = M.arch_by_layers[L] || [];
    const prev = sel.value;
    sel.innerHTML = "";
    opts.forEach(label => {
      const o = document.createElement("option");
      o.value = label; o.textContent = label;
      sel.appendChild(o);
    });
    if (opts.includes(prev)) sel.value = prev;
    else if (opts.length) sel.value = opts[0];
  }

  function predIndex() {
    if (M.mode === "rf") {
      const di = M.depth_values.indexOf(parseInt(el("rf-depth").value, 10));
      const ti = M.tree_values.indexOf(parseInt(el("rf-trees").value, 10));
      return di * M.n_trees + ti;
    }
    if (M.mode === "knn") return M.k_values.indexOf(parseInt(el("knn-k").value, 10));
    let mi = M.mlp_keys.indexOf(mlpKey());
    return mi < 0 ? 0 : mi;
  }

  function metricsText(pi) {
    const m = M.metrics[pi];
    return (
      `<b>RMSE</b> (vs hidden step truth)<br>`
      + `Interpolation [0,6]: ${m[0].toFixed(2)}<br>`
      + `Extrapolation (6,10]: ${m[1].toFixed(2)}<br>`
      + `Training label range: [${M.y_min.toFixed(2)}, ${M.y_max.toFixed(2)}]`
    );
  }

  function applyUpdate() {
    const gd = document.getElementById(plotId);
    if (!gd || !gd.data) return;
    const pi = predIndex();
    Plotly.restyle(gd, { y: [M.predictions[pi]] }, [M.pred_trace_idx]);
    Plotly.relayout(gd, { "annotations[1].text": metricsText(pi) });

    Plotly.restyle(gd, { visible: vis }, [0, 1, 2, M.pred_trace_idx]);

  function setHidden(show) {

    g.innerHTML = `<div class="group-title">${title}</div>` + inner;

        `<label>max_depth <select id="${P}-rf-depth"></select></label>`

      fill(el("rf-depth"), M.depth_values);
      fill(el("rf-trees"), M.tree_values);
      el("rf-depth").value = String(M.defaults.depth);
      el("rf-trees").value = String(M.defaults.trees);
      ["rf-depth", "rf-trees"].forEach(id => el(id).addEventListener("change", applyUpdate));

      addGroup("MLP (sklearn)",
        `<label>layers <select id="${P}-mlp-layers"></select></label>`
        + `<label>architecture <select id="${P}-mlp-arch"></select></label>`
        + `<label>batch norm <select id="${P}-mlp-bn"><option value="0">off</option><option value="1">on</option></select></label>`
        + `<label>dropout <select id="${P}-mlp-do"><option value="0">off</option><option value="1">on</option></select></label>`
        + `<label>loss <select id="${P}-mlp-loss"></select></label>`
        + `<label>batch size <select id="${P}-mlp-bs"></select></label>`);
      fill(el("mlp-layers"), Object.keys(M.arch_by_layers));
      fill(el("mlp-loss"), M.defaults.loss_choices);
      fill(el("mlp-bs"), M.defaults.batch_choices);
      el("mlp-layers").value = String(M.defaults.layers);
      el("mlp-bn").value = String(M.defaults.bn);
      el("mlp-do").value = String(M.defaults.dropout);
      el("mlp-loss").value = M.defaults.loss;
      el("mlp-bs").value = String(M.defaults.batch_size);
      refreshArchOptions();
      el("mlp-arch").value = M.defaults.arch_label;
      ["mlp-layers", "mlp-arch", "mlp-bn", "mlp-do", "mlp-loss", "mlp-bs"].forEach(id =>
        el(id).addEventListener("change", () => {
          if (id === "mlp-layers") refreshArchOptions();
          applyUpdate();
        }));
    } else {
      addGroup("k-NN", `<label>k <select id="${P}-knn-k"></select></label>`);
      fill(el("knn-k"), M.k_values);
      el("knn-k").value = String(M.defaults.k);
      el("knn-k").addEventListener("change", applyUpdate);
    }

    addGroup("Validation",
      `<button type="button" id="${P}-hide-val" disabled>Hide hidden validation</button>`
      + `<button type="button" id="${P}-show-val">Show hidden validation</button>`);
    el("hide-val").addEventListener("click", () => setHidden(false));
    el("show-val").addEventListener("click", () => setHidden(true));
    setHidden(false);
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", wire);
